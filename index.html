<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silkworm AI - Mobile Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121821;
    --card: #1c2431;
    --accent: #00d28a;
    --accent-glow: rgba(0, 210, 138, 0.3);
    --text: #ffffff;
    --text-dim: #94a3b8;
    --border: #2d3748;
    --warn: #ff9f43;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; line-height: 1.6; }

  /* ── LOGIN PAGE ── */
  #auth-portal { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card { background: var(--card); width: 100%; max-width: 350px; padding: 30px; border-radius: 24px; border: 1px solid var(--border); text-align: center; }
  .auth-logo { font-size: 40px; margin-bottom: 10px; }
  .input-field { width: 100%; background: #0f172a; border: 1px solid var(--border); border-radius: 12px; padding: 14px; color: #fff; margin-bottom: 15px; font-size: 14px; }
  .btn-primary { width: 100%; background: var(--accent); color: #000; padding: 14px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; }

  /* ── LAYOUT ── */
  #dashboard-layout { display: none; padding-bottom: 80px; }
  .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg); z-index: 100; }
  .lang-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 20px; font-size: 12px; }

  .view-section { padding: 0 20px; display: none; animation: slideUp 0.4s ease; }
  .view-section.active { display: block; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  /* ── CARDS (Matching your image) ── */
  .section-title { font-size: 16px; font-weight: 400; color: var(--text-dim); margin-bottom: 15px; padding-left: 5px; }
  .panel { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); }

  /* Gauge Styles */
  .gauge-container { display: flex; flex-direction: column; align-items: center; gap: 30px; padding: 20px 0; }
  .gauge-box { position: relative; width: 150px; height: 100px; display: flex; flex-direction: column; align-items: center; }
  .gauge-svg { width: 120px; height: 120px; transform: rotate(-90deg); }
  .gauge-bg { fill: none; stroke: #2d3748; stroke-width: 10; stroke-linecap: round; }
  .gauge-fill { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 251; stroke-dashoffset: 251; transition: 1s ease-out; }
  .gauge-text { position: absolute; top: 35px; text-align: center; }
  .gauge-val { font-size: 22px; font-weight: 600; }
  .gauge-lbl { font-size: 12px; color: var(--text-dim); margin-top: 55px; }

  /* Small Stats (Below gauges in your image) */
  .stat-row { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 15px; margin-bottom: 10px; }
  .stat-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(0,210,138,0.1); font-size: 18px; }

  /* Bottom Navigation */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid var(--border); }
  .nav-item { color: var(--text-dim); font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
  .nav-item.active { color: var(--accent); }
  .nav-item i { font-size: 20px; }

  .footer-info { text-align: center; font-size: 10px; color: var(--text-dim); padding: 20px; font-family: 'JetBrains Mono', monospace; }

</style>
</head>
<body>

<div id="auth-portal">
  <div class="auth-card">
    <div class="auth-logo">🌿</div>
    <h2 style="margin-bottom: 20px;" data-i18n="login_title">Silkworm Login</h2>
    <input type="email" class="input-field" placeholder="Email">
    <input type="password" class="input-field" placeholder="Password">
    <button class="btn-primary" onclick="login()" data-i18n="btn_login">Login</button>
  </div>
</div>

<div id="dashboard-layout">
  <div class="header">
    <div class="logo-text"><b data-i18n="top_title">Real-Time Sensor Monitoring</b></div>
    <button class="lang-btn" onclick="toggleLang()" id="lang-btn">ಕನ್ನಡ</button>
  </div>

  <div id="view-dashboard" class="view-section active">
    <div class="panel">
      <div class="gauge-container">
        <div class="gauge-box">
          <svg class="gauge-svg" viewBox="0 0 100 100">
            <circle class="gauge-bg" cx="50" cy="50" r="40"/>
            <circle class="gauge-fill" id="g-temp" cx="50" cy="50" r="40" style="stroke: #ff7f50;"/>
          </svg>
          <div class="gauge-text"><span class="gauge-val" id="v-temp">30.1</span><small>°C</small></div>
          <div class="gauge-lbl" data-i18n="lbl_temp">Temperature</div>
        </div>
        <div class="gauge-box">
          <svg class="gauge-svg" viewBox="0 0 100 100">
            <circle class="gauge-bg" cx="50" cy="50" r="40"/>
            <circle class="gauge-fill" id="g-hum" cx="50" cy="50" r="40" style="stroke: #00bfff;"/>
          </svg>
          <div class="gauge-text"><span class="gauge-val" id="v-hum">62.7</span><small>%</small></div>
          <div class="gauge-lbl" data-i18n="lbl_hum">Humidity</div>
        </div>
        <div class="gauge-box">
          <svg class="gauge-svg" viewBox="0 0 100 100">
            <circle class="gauge-bg" cx="50" cy="50" r="40"/>
            <circle class="gauge-fill" id="g-gas" cx="50" cy="50" r="40" style="stroke: #a29bfe;"/>
          </svg>
          <div class="gauge-text"><span class="gauge-val" id="v-gas">451</span><small>ADC</small></div>
          <div class="gauge-lbl" data-i18n="lbl_gas">Gas / Air Quality</div>
        </div>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-icon">🌡️</div>
      <div><div style="font-size:12px; color:var(--text-dim)" data-i18n="lbl_temp">Temperature</div><div style="font-weight:600"><span id="s-temp">30.1</span>°C</div></div>
    </div>
    <div class="stat-row">
      <div class="stat-icon">💧</div>
      <div><div style="font-size:12px; color:var(--text-dim)" data-i18n="lbl_hum">Humidity</div><div style="font-weight:600"><span id="s-hum">62.7</span>%</div></div>
    </div>
  </div>

  <div id="view-settings" class="view-section">
    <h3 class="section-title" data-i18n="nav_settings">Settings</h3>
    <div class="panel">
      <div style="padding: 10px 0;" data-i18n="lbl_device">Device: nodeMCU_01</div>
      <button class="btn-primary" style="background:#ff4d4d; color:white; margin-top:20px;" onclick="logout()" data-i18n="btn_logout">Logout</button>
    </div>
  </div>

  <div class="footer-info">
    Device ID: nodeMCU_01 • <span id="last-update">Updating...</span>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" onclick="nav(this, 'view-dashboard')"><span>📊</span><div data-i18n="nav_dash">Dash</div></div>
    <div class="nav-item" onclick="nav(this, 'view-settings')"><span>⚙️</span><div data-i18n="nav_settings">Settings</div></div>
  </nav>
</div>

<script>
let lang = 'en';
const dict = {
  'en': {
    'login_title': 'Silkworm Login', 'btn_login': 'Login', 'top_title': 'Sensor Monitoring',
    'nav_dash': 'Dash', 'nav_settings': 'Settings', 'lbl_temp': 'Temperature',
    'lbl_hum': 'Humidity', 'lbl_gas': 'Gas / Air Quality', 'btn_logout': 'Logout', 'lbl_device': 'Device'
  },
  'kn': {
    'login_title': 'ರೇಷ್ಮೆ ಲಾಗಿನ್', 'btn_login': 'ಪ್ರವೇಶಿಸಿ', 'top_title': 'ಸೆನ್ಸರ್ ಮಾನಿಟರಿಂಗ್',
    'nav_dash': 'ಡ್ಯಾಶ್', 'nav_settings': 'ಸೆಟ್ಟಿಂಗ್ಸ್', 'lbl_temp': 'ತಾಪಮಾನ',
    'lbl_hum': 'ಆರ್ದ್ರತೆ', 'lbl_gas': 'ಅನಿಲ ಗುಣಮಟ್ಟ', 'btn_logout': 'ನಿರ್ಗಮಿಸಿ', 'lbl_device': 'ಸಾಧನ'
  }
};

function toggleLang() {
  lang = (lang === 'en') ? 'kn' : 'en';
  document.getElementById('lang-btn').textContent = (lang === 'en') ? 'ಕನ್ನಡ' : 'English';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = dict[lang][el.getAttribute('data-i18n')];
  });
}

function login() { 
  document.getElementById('auth-portal').style.display = 'none';
  document.getElementById('dashboard-layout').style.display = 'block';
  updateGauges(30.1, 62.7, 451);
}

function logout() {
  document.getElementById('auth-portal').style.display = 'flex';
  document.getElementById('dashboard-layout').style.display = 'none';
}

function nav(el, id) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function updateGauges(t, h, g) {
  // SVG Progress calculation
  const setCircle = (id, val, max) => {
    const el = document.getElementById(id);
    const offset = 251 - (val / max) * 251;
    el.style.strokeDashoffset = offset;
  };

  setCircle('g-temp', t, 50);
  setCircle('g-hum', h, 100);
  setCircle('g-gas', g, 1024);

  document.getElementById('v-temp').textContent = t;
  document.getElementById('v-hum').textContent = h;
  document.getElementById('v-gas').textContent = g;
  document.getElementById('s-temp').textContent = t;
  document.getElementById('s-hum').textContent = h;
  document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
}

// Simulated Hardware Listener (You will replace this with real MQTT)
setInterval(() => {
  if(document.getElementById('dashboard-layout').style.display === 'block') {
    const nt = (30 + Math.random()).toFixed(1);
    const nh = (62 + Math.random()).toFixed(1);
    const ng = Math.floor(450 + Math.random() * 5);
    updateGauges(nt, nh, ng);
  }
}, 3000);

</script>
</body>
</html>
